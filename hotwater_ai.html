<script type="text/x-red" data-help-name="nibe-hotwater-ai">
    <p>
        <b>Nibe Hotwater AI</b> visar VV-AI-data fr varmvatten.
    </p>

    <h3>Lge 1  Backend (rekommenderas)</h3>
    <p>
        Nr en <b>Server</b> (nibe-config) r vald lyssnar noden p backend-eventet
        <code>pluginHotwaterAI</code> som genereras av NibePi-backenden.
        Noden skickar d vidare VV-AI-paketet till fldet.
    </p>
    <p><code>msg.payload</code> innehller bl.a.:</p>
    <ul>
        <li><code>timestamp</code>  tidsstmpel i ms</li>
        <li><code>hourIndex</code>  0167 (timme i veckan)</li>
        <li><code>bt6</code>, <code>bt7</code>  aktuella temperaturer</li>
        <li><code>profile</code>  168-lngds profilvektor</li>
        <li><code>preheatHours</code>  antal timmar fr frvrmning</li>
        <li><code>vv_ai_min_temp_enable</code>, <code>vv_ai_min_temp</code>, <code>vv_ai_min_temp_below</code></li>
    </ul>

    <h3>Lge 2  Legacy (lokal BT7-profil)</h3>
    <p>
        Om inget backend-paket anvnds kan noden i stllet ta emot BT7 direkt:
    </p>
    <ul>
        <li><code>msg.bt7</code> (rekommenderas)</li>
        <li><code>msg.payload</code> + <code>msg.topic</code> som innehller "bt7"</li>
    </ul>
    <p>
        I detta lge lr noden en enkel 168h-veckoprofil av BT7 och skickar ut
 profil + i <code>msg.payload</code>.
    </p>

    <h3>Utgng</h3>
    <p><code>msg.topic</code> stts till nodens Topic (standard <code>nibe_vv_ai</code>).</p>
</script>

<script type="text/javascript">
    (function () {
        RED.nodes.registerType('nibe-hotwater-ai', {

                topic:  { value: "nibe_vv_ai" }
            },
            inputs: 1,
            outputs: 1,
            icon: "inject.svg",
            label: function () {
                return this.name || "Nibe Hotwater AI";
            },
            labelStyle: function () {
                return this.name ? "node_label_italic" : "";
            }
        });
    })();
</script>
